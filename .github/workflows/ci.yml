name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: chmod +x ./mvnw && ./mvnw -B clean verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Build image and start the stack
        run: |
          printf 'DB_PASSWORD=ci-password\nJWT_SECRET=%s\nADMIN_PASSWORD=ci-admin-password\n' "$(openssl rand -base64 48)" > .env
          docker compose up -d --wait
          curl -fs http://localhost:8080/actuator/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs